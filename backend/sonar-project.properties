# ===== SonarQube - MineMarket Backend (Node.js / Express) =====
sonar.projectKey=minemarket-backend
sonar.projectName=MineMarket - Backend
sonar.projectVersion=1.0.0

# Servidor SonarQube (ajustar según el entorno; el token se pasa con SONAR_TOKEN)
sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.exclusions=node_modules/**,coverage/**

# Reporte de cobertura generado por Jest (npm run test)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.js,tests/**
