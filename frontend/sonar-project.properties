# ===== SonarQube - MineMarket Frontend (React / Vite) =====
sonar.projectKey=minemarket-frontend
sonar.projectName=MineMarket - Frontend
sonar.projectVersion=1.0.0

# Servidor SonarQube (ajustar según el entorno; el token se pasa con SONAR_TOKEN)
sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests,e2e
sonar.test.inclusions=tests/**/*.test.js,tests/**/*.test.jsx,e2e/**/*.spec.js
sonar.exclusions=node_modules/**,dist/**,coverage/**,playwright-report/**,test-results/**

# Reporte de cobertura generado por Vitest (npm run test)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.jsx,tests/**,e2e/**
